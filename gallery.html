<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tranquility Paradise Resort</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Fraunces:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <link href="/src/output.css" rel="stylesheet">
</head>

<body>
  <section
    class="relative flex flex-col justify-center min-h-[856px] pt-[101px] px-[79px] bg-[url('/images/gallery/gallery-hero-clean.jpg')] bg-cover bg-center bg-no-repeat">
    <div id="header" class="absolute top-0 left-0 w-full z-50"></div>
    <div class="flex flex-col gap-[19px]">
      <h1 class="font-car text-ivory text-[72px] leading-[86.92px]">
        <span class="block font-bold">Gallery</span>
      </h1>
      <p class="max-w-[772px] font-dm font-light text-[18px] leading-[29.25px] text-[#F7F3EA]">
        Photos of places, people, seasons, and meditative quietude
        carved into the granite pine ridges of northern Kathmandu.
      </p>
    </div>
  </section>

  <section class="relative bg-pinkish-white px-6 pb-[74px] pt-[33px]">
    <div class="mx-auto flex max-w-[1266px] flex-col items-center gap-[7px] text-center">
      <img src="/images/homepage/crownlogo.png" alt="" class="h-[55px] w-[191px]">
      <p class="font-dm text-[16px] font-semibold uppercase leading-[13.5px] tracking-[2.7px] text-golden">Our Memories</p>
      <h2 class="font-car text-[50px] font-bold leading-[63.8px] text-[#183A32]">Gallery Preview</h2>
      <a href="gallery.html"
        class="mt-4 inline-flex h-[35px] items-center rounded-[12px] bg-golden px-[14px] font-dm text-[14px] font-semibold leading-5 tracking-[0.05em] text-ivory lg:absolute lg:right-[79px] lg:top-[99px] lg:mt-0">View
        Full Gallery</a>
    </div>

    <!-- filter tabs -->
    <div class="mx-auto mt-[21px] flex max-w-[684.6px] flex-wrap justify-center gap-x-[33px] gap-y-3">
      <button
        class="h-[30px] rounded-full bg-golden px-[16.8px] font-dm text-[14px] font-medium leading-4 text-ivory shadow-[0_4px_4px_rgba(0,0,0,0.25)]">All</button>
      <button class="h-[30px] rounded-full px-[16.8px] font-dm text-[14px] font-medium leading-4 text-[#252A27]">Resort</button>
      <button class="h-[30px] rounded-full px-[16.8px] font-dm text-[14px] font-medium leading-4 text-[#252A27]">Rooms</button>
      <button class="h-[30px] rounded-full px-[16.8px] font-dm text-[14px] font-medium leading-4 text-[#252A27]">Dining</button>
      <button class="h-[30px] rounded-full px-[16.8px] font-dm text-[14px] font-medium leading-4 text-[#252A27]">Events</button>
      <button class="h-[30px] rounded-full px-[16.8px] font-dm text-[14px] font-medium leading-4 text-[#252A27]">Nature</button>
    </div>

    <!-- grid: 3 cols x 4 rows of 359px. col gap 14, row gap 10 -->
    <div
      class="mx-auto mt-[46px] grid max-w-[1266px] auto-rows-[200px] grid-cols-2 gap-[10px] lg:auto-rows-[359px] lg:grid-cols-3 lg:gap-x-[14px]">

      <!-- rows 1-2 -->
      <img src="/images/homepage/section10-img1.jpg" alt=""
        class="col-span-2 size-full rounded-[12px] object-cover lg:col-span-1 lg:row-span-2">
      <img src="/images/homepage/section10-img2.jpg" alt="" class="size-full rounded-[12px] object-cover">
      <img src="/images/homepage/section10-img3.jpg" alt="" class="size-full rounded-[12px] object-cover">
      <img src="/images/homepage/section10-img4.jpg" alt="" class="size-full rounded-[12px] object-cover">
      <img src="/images/homepage/section10-img5.jpg" alt="" class="size-full rounded-[12px] object-cover">

      <!-- rows 3-4. img10 listed before img8 and img9 on purpose -->
      <img src="/images/gallery/gallery-img6.jpg" alt="" class="size-full rounded-[12px] object-cover">
      <img src="/images/gallery/gallery-img7.jpg" alt="" class="size-full rounded-[12px] object-cover">
      <img src="/images/gallery/gallery-img10.jpg" alt=""
        class="col-span-2 size-full rounded-[12px] object-cover lg:col-span-1 lg:row-span-2">
      <img src="/images/gallery/gallery-img8.jpg" alt="" class="size-full rounded-[12px] object-cover">
      <img src="/images/gallery/gallery-img9.jpg" alt="" class="size-full rounded-[12px] object-cover">

    </div>
  </section>

  <!-- footer -->
  <div id="footer"></div>
  <script src="/src/components.js"></script>
</body>

</html>
